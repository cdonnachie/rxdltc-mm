[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rxdltc-mm"
version = "0.2.0"
description = "Conservative two-sided liquidity bot for RXD/LTC on GLEEC DEX (Komodo DeFi Framework)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rxdltc-mm = "rxdltc_mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
