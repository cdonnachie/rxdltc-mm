name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach installers to a release on tag builds

jobs:
  test:
    name: bot tests (Python)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: offline simulation smoke run
        run: rxdltc-mm --config config.example.yaml --simulate --cycles 3

  build:
    name: desktop app (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Linux build dependencies (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the bot sidecar (PyInstaller)
        run: |
          pip install . pyinstaller
          python ui/build-sidecar.py

      - name: Rust unit tests
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      # The App Store Connect key is a .p8 file; Tauri wants a path to it, so the secret holds
      # the file's contents and it is materialised here. Skipped when the secret is unset.
      - name: Prepare Apple notarisation key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            mkdir -p "$HOME/private_keys"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
            chmod 600 "$HOME/private_keys/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
            echo "notarisation key ready"
          else
            echo "APPLE_API_KEY_CONTENT not set; the macOS bundle will not be notarised"
          fi

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarisation. Every value is empty until the matching secret
          # exists, and Tauri then produces unsigned bundles exactly as before. The signing
          # identity is deliberately tied to the certificate: setting an identity without the
          # certificate in the keychain would fail the build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: ui
          args: --target ${{ matrix.target }}
          # On a tag push the installers are attached to a draft GitHub release; on other
          # runs they are only uploaded as workflow artifacts (see below).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('RXD/LTC Liquidity Bot {0}', github.ref_name) || '' }}
          releaseBody: "Windows builds are unsigned, so SmartScreen warns on first launch. macOS builds are signed and notarised when the signing secrets are configured."
          releaseDraft: true
          prerelease: true

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxdltc-mm-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
