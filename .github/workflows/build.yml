name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach installers to a release on tag builds

jobs:
  test:
    name: bot tests (Python)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: offline simulation smoke run
        run: rxdltc-mm --config config.example.yaml --simulate --cycles 3

  build:
    name: desktop app (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      - name: Linux build dependencies (Tauri 2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build the bot sidecar (PyInstaller)
        run: |
          pip install . pyinstaller
          python ui/build-sidecar.py

      - name: Rust unit tests
        run: cargo test --manifest-path ui/src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          args: --target ${{ matrix.target }}
          # On a tag push the installers are attached to a draft GitHub release; on other
          # runs they are only uploaded as workflow artifacts (see below).
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('RXD/LTC Liquidity Bot {0}', github.ref_name) || '' }}
          releaseBody: "Unsigned builds. Windows SmartScreen and macOS Gatekeeper will warn on first launch."
          releaseDraft: true
          prerelease: true

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rxdltc-mm-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
