# docker compose up -d
#
# Services on a private network: the Komodo DeFi Framework node (kdf), the bot, and an
# optional monitoring pair (prometheus, grafana) behind the `monitoring` profile.
# Nothing except Grafana and the bot's status port is reachable from the host, and both
# are bound to 127.0.0.1 so you reach them over an SSH tunnel rather than the internet.
#
# Put secrets in ./.env (see .env.example); compose passes them as environment.
#
# Everything together:      docker compose --profile monitoring up -d
# Bot and KDF only:         docker compose up -d
# Monitoring only:          docker compose --profile monitoring up -d prometheus grafana
#
# With the bot in Docker, set `metrics.bind: 0.0.0.0` in config.yaml so Prometheus can reach
# it inside the network; 127.0.0.1 would only be reachable from inside the bot's container.
#
# If the bot runs on the host instead of in Docker (a desktop install, or systemd), use the
# standalone stack that scrapes the host: docker compose -f deploy/monitoring-compose.yml up -d

services:
  kdf:
    # GLEEC's fork does not publish a container image; build it from source
    # (https://github.com/GLEECBTC/komodo-defi-framework, docs/DEV_ENVIRONMENT.md)
    # or use the upstream image and confirm it is compatible with GLEEC DEX.
    image: komodoofficial/komodo-defi-framework:main-latest
    restart: unless-stopped
    volumes:
      - ./kdf:/kdf                       # MM2.json and coins live here (see deploy/MM2.json.example)
      - kdf-db:/kdf/DB
    working_dir: /kdf
    environment:
      MM_CONF_PATH: /kdf/MM2.json
      MM_COINS_PATH: /kdf/coins
      MM_LOG: /kdf/mm2.log
    # rpcip in MM2.json must be 0.0.0.0 for the bot container to reach it; the
    # port stays private to this compose network because it is not published.
    expose:
      - "7783"
    stop_grace_period: 30s

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - kdf
    env_file: .env
    environment:
      KDF_RPC_URL: http://kdf:7783
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - bot-data:/data
    expose:
      - "9109"                           # scraped by prometheus inside the network
    ports:
      - "127.0.0.1:9109:9109"            # /status and /metrics, localhost only
    stop_grace_period: 45s               # SIGTERM -> cancel orders -> persist -> exit

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    # No depends_on: Prometheus retries a target that is not up yet, and depending on the bot
    # would drag the bot and KDF along whenever you start monitoring on its own.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  grafana:
    image: grafana/grafana-oss:11.5.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Change the password, or put GF_SECURITY_ADMIN_PASSWORD in .env.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"            # reach it with: ssh -L 3000:127.0.0.1:3000 user@host

volumes:
  kdf-db:
  bot-data:
  prometheus-data:
  grafana-data:
